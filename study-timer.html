<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勉強タイマー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --muted: #888;
    --accent: #4A7CF7;
    --accent-soft: #EDF1FE;
    --break: #34C98B;
    --break-soft: #E6F9F2;
    --danger: #F25C5C;
    --radius: 20px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }

  body {
    background: var(--bg);
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 380px;
    padding: 40px 28px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.4s;
    position: relative;
  }
  .card.break-mode { background: var(--break-soft); }

  .gear-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    background: #F0F0EE;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    transition: background 0.15s, transform 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .gear-btn:active { background: #E0E0DC; transform: scale(0.93); }
  .gear-btn.spinning { animation: spin 0.4s ease; }
  @keyframes spin { to { transform: rotate(180deg); } }

  .mode-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
    transition: color 0.4s;
  }
  .card.break-mode .mode-label { color: var(--break); }

  .ring-wrap {
    position: relative;
    width: 210px;
    height: 210px;
    margin-bottom: 36px;
  }
  .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #EBEBEB; stroke-width: 10; }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 565;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.4s;
  }
  .card.break-mode .ring-progress { stroke: var(--break); }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .time-display {
    font-size: 52px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .time-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }

  .sessions { display: flex; gap: 8px; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #DDD; transition: background 0.3s; }
  .dot.done { background: var(--accent); }

  .today-total {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
    letter-spacing: 0.03em;
  }
  .today-total strong { color: var(--accent); font-weight: 700; }
  .card.break-mode .today-total strong { color: var(--break); }

  .btn-row { display: flex; gap: 12px; width: 100%; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    padding: 16px 0;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.8; transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .card.break-mode .btn-primary { background: var(--break); }
  .btn-ghost { background: #F0F0EE; color: var(--text); }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }

  @keyframes popIn {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .popup {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 36px 28px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    animation: popIn 0.2s ease;
  }
  .popup-emoji { font-size: 44px; margin-bottom: 16px; }
  .popup-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .popup-body { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
  .countdown-bar-wrap { height: 4px; background: #EEE; border-radius: 4px; margin: 16px 0 24px; overflow: hidden; }
  .countdown-bar { height: 100%; background: var(--danger); border-radius: 4px; width: 100%; transition: width 1s linear; }
  .popup-btns { display: flex; gap: 10px; }
  .popup-btns .btn { font-size: 15px; padding: 14px 0; }
  .btn-yes { background: var(--break); color: #fff; flex: 1.2; }
  .btn-no  { background: #F0F0EE; color: var(--text); flex: 1; }

  .settings-panel {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    animation: popIn 0.2s ease;
    max-height: 90dvh;
    overflow-y: auto;
  }
  .settings-panel h2 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    letter-spacing: 0.01em;
  }
  .setting-row { margin-bottom: 20px; }
  .setting-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }
  .setting-value-row { display: flex; align-items: center; gap: 12px; }
  .stepper-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: #F0F0EE;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .stepper-btn:active { background: #E0E0DC; transform: scale(0.93); }
  .stepper-val { flex: 1; text-align: center; font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .stepper-unit { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .vol-row { display: flex; align-items: center; gap: 12px; }
  .vol-icon { font-size: 18px; flex-shrink: 0; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 4px;
    background: #DDD;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(74,124,247,0.35);
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px;
    border: none; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  .vol-pct { font-size: 13px; color: var(--muted); width: 38px; text-align: right; flex-shrink: 0; }

  .divider { height: 1px; background: #F0F0EE; margin: 20px 0; }

  .stat-block {
    background: #F7F7F5;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .stat-val { font-size: 20px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .stat-reset {
    border: none;
    background: #E8E8E5;
    border-radius: 8px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .stat-reset:active { opacity: 0.7; }

  .settings-btns { display: flex; gap: 10px; margin-top: 4px; }
  .settings-btns .btn { font-size: 15px; padding: 14px 0; }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-cancel { background: #F0F0EE; color: var(--text); }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toggle-desc { font-size: 14px; color: var(--text); line-height: 1.4; }
  .toggle-desc small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .toggle {
    position: relative;
    width: 48px;
    height: 28px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: #DDD;
    border-radius: 28px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .toggle input:checked + .toggle-track { background: var(--break); }
  .toggle input:checked + .toggle-track::after { transform: translateX(20px); }
</style>
</head>
<body>

<div class="card" id="card">
  <button class="gear-btn" id="gearBtn" onclick="openSettings()" title="設定">⚙️</button>
  <div class="mode-label" id="modeLabel">勉強中</div>

  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="90"/>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"/>
    </svg>
    <div class="ring-center">
      <div class="time-display" id="timeDisplay">25:00</div>
      <div class="time-sub" id="timeSub">残り時間</div>
    </div>
  </div>

  <div class="sessions" id="sessions">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>

  <div class="today-total">今日の勉強時間：<strong id="todayDisplay">0秒</strong></div>

  <div class="btn-row">
    <button class="btn btn-ghost" id="resetBtn" onclick="resetTimer()">リセット</button>
    <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">スタート</button>
  </div>
</div>

<!-- Break popup -->
<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-emoji">☕</div>
    <div class="popup-title">お疲れさま！</div>
    <div class="popup-body" id="popupBody">よく頑張ったね。<br>休憩する？</div>
    <div class="countdown-bar-wrap">
      <div class="countdown-bar" id="countdownBar"></div>
    </div>
    <div class="popup-btns">
      <button class="btn btn-yes" id="breakYesBtn" onclick="startBreak()">はい（5分休憩）</button>
      <button class="btn btn-no" onclick="continueStudy()">いいえ（続ける）</button>
    </div>
  </div>
</div>

<!-- Settings overlay -->
<div class="overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2>⚙️ 設定</h2>

    <div class="setting-row">
      <span class="setting-label">勉強時間</span>
      <div class="setting-value-row">
        <button class="stepper-btn" onclick="step('study',-1)">−</button>
        <span class="stepper-val" id="studyVal">25</span>
        <button class="stepper-btn" onclick="step('study',1)">＋</button>
        <span class="stepper-unit">分</span>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">休憩時間</span>
      <div class="setting-value-row">
        <button class="stepper-btn" onclick="step('break',-1)">−</button>
        <span class="stepper-val" id="breakVal">5</span>
        <button class="stepper-btn" onclick="step('break',1)">＋</button>
        <span class="stepper-unit">分</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="setting-row">
      <span class="setting-label">ティック音量</span>
      <div class="vol-row">
        <span class="vol-icon">🔇</span>
        <input type="range" id="volSlider" min="0" max="100" value="40" oninput="onVolChange(this.value)">
        <span class="vol-icon">🔊</span>
        <span class="vol-pct" id="volPct">40%</span>
      </div>
      <div style="margin-top:10px;">
        <button class="btn btn-ghost" style="width:100%;font-size:14px;padding:10px 0;" onclick="playTestTick()">🎵 テスト再生</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="setting-row">
      <span class="setting-label">今日の勉強時間</span>
      <div class="stat-block">
        <span class="stat-val" id="todayAllDisplay">0秒</span>
        <button class="stat-reset" onclick="confirmResetToday()">リセット</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">累計勉強時間（全期間）</span>
      <div class="stat-block">
        <span class="stat-val" id="totalAllDisplay">0秒</span>
        <button class="stat-reset" onclick="confirmResetAll()">リセット</button>
      </div>
    </div>


    <div class="divider"></div>

    <div class="setting-row">
      <div class="toggle-row">
        <div class="toggle-desc">
          休憩から始める
          <small>スタート時に休憩タイマーから開始する</small>
        </div>
        <label class="toggle">
          <input type="checkbox" id="breakFirstToggle" onchange="tmpBreakFirst = this.checked">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="settings-btns">
      <button class="btn btn-cancel" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-save" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
  const CIRCUMFERENCE = 2 * Math.PI * 90;
  const POPUP_WAIT = 10;

  // ---- Persistent storage: stats ----
  function todayKey() {
    const d = new Date();
    return `study_day_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
  }
  function loadTodaySec()  { return parseInt(localStorage.getItem(todayKey()) || '0', 10); }
  function addTodaySec(s)  { localStorage.setItem(todayKey(), loadTodaySec() + s); }
  function loadTotalSec()  { return parseInt(localStorage.getItem('study_total_sec') || '0', 10); }
  function addTotalSec(s)  { localStorage.setItem('study_total_sec', loadTotalSec() + s); }
  function confirmResetToday() {
    if (confirm('今日の勉強時間をリセットしますか？')) {
      localStorage.setItem(todayKey(), '0');
      renderStats();
    }
  }
  function confirmResetAll() {
    if (confirm('累計勉強時間をリセットしますか？')) {
      localStorage.setItem('study_total_sec', '0');
      renderStats();
    }
  }
  function fmtDuration(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}時間${m}分`;
    if (m > 0) return `${m}分${s > 0 ? s + '秒' : ''}`;
    return `${s}秒`;
  }
  function renderStats() {
    const today = fmtDuration(loadTodaySec());
    document.getElementById('todayDisplay').textContent = today;
    const tEl = document.getElementById('todayAllDisplay');
    if (tEl) tEl.textContent = today;
    const aEl = document.getElementById('totalAllDisplay');
    if (aEl) aEl.textContent = fmtDuration(loadTotalSec());
  }

  // ---- Timer state persistence ----
  function saveState() {
    localStorage.setItem('timer_state', JSON.stringify({
      studyMin, breakMin, tickVol, breakFirst,
      remaining, totalSec, isBreak, sessionsDone
    }));
  }
  function loadState() {
    try {
      const raw = localStorage.getItem('timer_state');
      if (!raw) return;
      const s = JSON.parse(raw);
      studyMin     = s.studyMin     ?? 25;
      breakMin     = s.breakMin     ?? 5;
      tickVol      = s.tickVol      ?? 0.4;
      breakFirst   = s.breakFirst   ?? false;
      isBreak      = s.isBreak      ?? false;
      sessionsDone = s.sessionsDone ?? 0;
      studySec     = studyMin * 60;
      breakSec     = breakMin * 60;
      totalSec     = s.totalSec     ?? studySec;
      remaining    = Math.max(0, Math.min(s.remaining ?? studySec, totalSec));
    } catch(e) {}
  }

  // ---- State variables (defaults, overwritten by loadState) ----
  let studyMin  = 25;
  let breakMin  = 5;
  let tickVol   = 0.4;
  let breakFirst = false;
  let studySec  = studyMin * 60;
  let breakSec  = breakMin * 60;
  let totalSec  = studySec;
  let remaining = studySec;
  let isRunning = false;
  let isBreak   = false;
  let sessionsDone = 0;
  let timerId   = null;
  let popupTimer = null;

  // Temp settings
  let tmpStudy = studyMin;
  let tmpBreak = breakMin;
  let tmpVol   = Math.round(tickVol * 100);
  let tmpBreakFirst = breakFirst;

  // ---- Audio ----
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTick(volume) {
    try {
      const ctx = getAudioCtx();
      const t = ctx.currentTime;
      const dur = 0.012;
      const bufLen = Math.ceil(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2200;
      bp.Q.value = 0.8;
      const gainNode = ctx.createGain();
      gainNode.gain.setValueAtTime(volume * 2.5, t);
      gainNode.gain.exponentialRampToValueAtTime(0.001, t + dur);
      noise.connect(bp);
      bp.connect(gainNode);
      gainNode.connect(ctx.destination);
      noise.start(t);
      noise.stop(t + dur);
    } catch(e) {}
  }
  function playTestTick() { playTick(tickVol); }

  // ---- DOM refs ----
  const card            = document.getElementById('card');
  const modeLabel       = document.getElementById('modeLabel');
  const timeDisplay     = document.getElementById('timeDisplay');
  const timeSub         = document.getElementById('timeSub');
  const ring            = document.getElementById('ringProgress');
  const startBtn        = document.getElementById('startBtn');
  const overlay         = document.getElementById('overlay');
  const countdownBar    = document.getElementById('countdownBar');
  const popupBody       = document.getElementById('popupBody');
  const breakYesBtn     = document.getElementById('breakYesBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const studyValEl      = document.getElementById('studyVal');
  const breakValEl      = document.getElementById('breakVal');
  const volSlider       = document.getElementById('volSlider');
  const volPct          = document.getElementById('volPct');

  ring.style.strokeDasharray = CIRCUMFERENCE;

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  function updateRing() {
    ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - remaining / totalSec);
  }
  function updateDots() {
    for (let i = 0; i < 4; i++)
      document.getElementById('d' + i).classList.toggle('done', i < sessionsDone);
  }
  function applyBreakMode() {
    if (isBreak) {
      card.classList.add('break-mode');
      modeLabel.textContent = '休憩中';
      timeSub.textContent   = '休憩残り';
    } else {
      card.classList.remove('break-mode');
      modeLabel.textContent = '勉強中';
      timeSub.textContent   = '残り時間';
    }
  }
  function render() {
    timeDisplay.textContent = fmt(remaining);
    updateRing();
  }

  function tick() {
    if (remaining <= 0) {
      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = 'スタート';
      saveState();
      if (!isBreak) {
        sessionsDone = Math.min(sessionsDone + 1, 4);
        updateDots();
        showPopup();
      } else {
        endBreak();
      }
      return;
    }
    rem
